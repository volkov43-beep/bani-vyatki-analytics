name: Full dashboard release QA

on:
  pull_request:
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "scripts/test-dashboard-release.py"
      - "scripts/check-responsive-foundation.mjs"
      - "scripts/check-public-dashboard.mjs"
      - "docs/responsive-iteration-08.md"
      - "README.md"
      - "scripts/check-navigation.mjs"
      - ".github/workflows/full-dashboard-qa.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "scripts/test-dashboard-release.py"
      - ".github/workflows/full-dashboard-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-browser:
    name: Final QA / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Syntax and September data regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-responsive-foundation.mjs
          node scripts/check-navigation.mjs
          node scripts/check-public-dashboard.mjs
          for name in app.js sources.js sales.js managers.js cycle.js navigation.js; do
            node --check "$name"
          done
          python3 -m py_compile scripts/test-dashboard-release.py
      - name: Install pinned Playwright and browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check playwright==1.56.0
          .venv/bin/python -m playwright install --with-deps "${{ matrix.browser }}"
      - name: Exercise all five pages and user journeys
        shell: bash
        env:
          BV_BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bv-full-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          .venv/bin/python scripts/test-dashboard-release.py
      - name: Attach screenshots and QA results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-qa-${{ matrix.browser }}
          path: artifacts/final-qa/${{ matrix.browser }}/
          retention-days: 14
          if-no-files-found: warn
