name: Responsive cycle browser QA

on:
  pull_request:
    paths:
      - "cycle.html"
      - "cycle.css"
      - "cycle-responsive.css"
      - "cycle.js"
      - "cycle-data.js"
      - "managers-data.js"
      - "styles.css"
      - "design-system.css"
      - "navigation.css"
      - "navigation.js"
      - "scripts/test-cycle-browser.py"
      - ".github/workflows/responsive-cycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cycle:
    name: Duration KPI, timeline and mobile date cards
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout PR contents
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Data and JavaScript integrity checks
        shell: bash
        run: |
          set -euo pipefail
          node --check cycle.js
          node --check cycle-data.js
          node --check managers-data.js
          node scripts/check-responsive-foundation.mjs
          node scripts/check-navigation.mjs
      - name: Install pinned browser test tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check playwright==1.56.0
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Test actual pages and capture screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bv-cycle-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          .venv/bin/python scripts/test-cycle-browser.py
      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cycle-iteration-07-screenshots
          path: artifacts/cycle/*.png
          retention-days: 7
          if-no-files-found: warn
