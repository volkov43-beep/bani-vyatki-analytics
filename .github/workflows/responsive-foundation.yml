name: Responsive foundation checks

on:
  pull_request:
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "scripts/check-responsive-foundation.mjs"
      - ".github/workflows/responsive-foundation.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "scripts/check-responsive-foundation.mjs"
      - ".github/workflows/responsive-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Design tokens, navigation and KPI integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check browser scripts and analytics integrity
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check scripts/check-responsive-foundation.mjs
          node scripts/check-responsive-foundation.mjs
          for file in app.js sources.js sales.js managers.js cycle.js; do
            node --check "$file"
          done
