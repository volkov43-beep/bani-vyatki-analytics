name: Responsive managers browser QA

on:
  pull_request:
    paths:
      - "managers.html"
      - "managers.css"
      - "managers-responsive.css"
      - "managers.js"
      - "managers-data.js"
      - "styles.css"
      - "design-system.css"
      - "navigation.css"
      - "navigation.js"
      - "scripts/test-managers-browser.py"
      - ".github/workflows/responsive-managers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managers:
    name: Revenue, deal margins, filters and mobile cards
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact PR contents
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate JavaScript and September data
        shell: bash
        run: |
          set -euo pipefail
          node --check managers.js
          node --check managers-data.js
          node scripts/check-responsive-foundation.mjs
          node scripts/check-navigation.mjs
      - name: Install pinned browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check playwright==1.56.0
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Run real responsive browser tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bv-managers-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          .venv/bin/python scripts/test-managers-browser.py
      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managers-iteration-06-screenshots
          path: artifacts/managers/*.png
          retention-days: 7
          if-no-files-found: warn
