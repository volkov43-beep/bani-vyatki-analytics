name: Responsive sales funnel browser QA

on:
  pull_request:
    paths:
      - "sales.html"
      - "sales.css"
      - "sales-responsive.css"
      - "sales.js"
      - "sales-data.js"
      - "styles.css"
      - "design-system.css"
      - "navigation.css"
      - "navigation.js"
      - "scripts/test-sales-browser.py"
      - "docs/responsive-iteration-05.md"
      - ".github/workflows/responsive-sales.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales:
    name: Sales trends, CRM stages and mobile analytics
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Structural and September financial integrity tests
        shell: bash
        run: |
          set -euo pipefail
          node --check sales.js
          node --check sales-data.js
          node scripts/check-responsive-foundation.mjs
          node scripts/check-navigation.mjs
      - name: Install pinned browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check playwright==1.56.0
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Run real responsive browser tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bv-sales-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          .venv/bin/python scripts/test-sales-browser.py
      - name: Upload screenshots for approval
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sales-iteration-05-screenshots
          path: artifacts/sales/*.png
          retention-days: 7
          if-no-files-found: warn
